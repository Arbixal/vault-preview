# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.23.1]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run build
    - run: npx playwright install --with-deps chromium
    - run: npm run test:e2e
    - name: Store Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: out

  deploy_aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: package
        path: out
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with: 
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: vault-preview-deploy
          aws-region: ap-southeast-2

    - name: Deploy to S3
      run: |
        aws s3 cp ./out s3://vault-preview-files/ --recursive
        aws cloudfront create-invalidation --distribution-id E2ODWIT9KI8RDE --paths "/index.html" "/404.html" "/favicon.ico" "/great_vault.png" "/next.svg" "/vercel.svg"
